name: Publish approved website
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact accepted version from releases/current.json'
        required: true
        type: string
      manifest_sha256:
        description: 'Exact SHA256 of SHA256SUMS.json for this accepted candidate'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  artifact:
    name: Release artifact validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Materialize the exact reviewed static files
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python scripts/validate_site.py --out artifacts/site
          python scripts/promote_preview.py --verify
          python -c 'import os; print("## Production candidate\n\nCommit: " + os.environ["GITHUB_SHA"] + "\n\nVersion: " + os.environ["EXPECTED_VERSION"] + "\n\nManifest SHA256: " + os.environ["EXPECTED_MANIFEST_SHA256"] + "\n\nDeployment requires the configured MarsTW2 review.")' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: artifacts/site
          # This staging tree contains only manifest-verified public files.
          include-hidden-files: true
  deploy:
    name: Approve production deployment
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
